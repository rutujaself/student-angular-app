<div class="container">

  <h2>Student Management System</h2>

  <app-student-form
    [editStudent]="selectedStudent"
    (studentAdded)="addOrUpdateStudent($event)">
  </app-student-form>

  <app-student-table
    [students]="students"
    (edit)="editStudent($event.student, $event.index)"
    (delete)="deleteStudent($event)">
  </app-student-table>

</div>
